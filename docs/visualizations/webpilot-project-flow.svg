<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 720">
  <title id="title">WebPilot project flow</title>
  <desc id="desc">A four-stage architecture diagram showing how WebPilot plans, builds, runs browser evidence, reflects on failures, repairs, and writes evaluation artifacts.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#052e3f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg-line { stroke: rgba(148, 163, 184, 0.16); stroke-width: 1; }
      .eyebrow { fill: #93c5fd; font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { fill: #f8fafc; font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { fill: #cbd5e1; font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .stage-title { fill: #e2e8f0; font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .stage-label { fill: #94a3b8; font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-transform: uppercase; }
      .card-title { fill: #f8fafc; font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .card-text { fill: #cbd5e1; font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { fill: #a7f3d0; font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .pill { fill: rgba(15, 23, 42, 0.78); stroke: rgba(148, 163, 184, 0.22); stroke-width: 1; }
      .panel { fill: rgba(15, 23, 42, 0.68); stroke: rgba(148, 163, 184, 0.22); stroke-width: 1; }
      .card { fill: rgba(15, 23, 42, 0.92); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.2; }
      .arrow { fill: none; stroke: #93c5fd; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="34" fill="url(#canvas)"/>
  <path class="bg-line" d="M80 142 H1200"/>
  <path class="bg-line" d="M80 628 H1200"/>
  <circle cx="1110" cy="94" r="180" fill="#38bdf8" opacity="0.08"/>
  <circle cx="205" cy="620" r="210" fill="#14b8a6" opacity="0.08"/>

  <text x="80" y="78" class="eyebrow">WEBPILOT MVP LOOP</text>
  <text x="80" y="120" class="title">Browser-grounded web coding agent</text>
  <text x="80" y="157" class="subtitle">Generate or edit a React app, run it in Chromium, inspect real evidence, repair known failures, and save auditable artifacts.</text>

  <g transform="translate(80 198)">
    <rect width="252" height="358" rx="22" class="panel"/>
    <rect x="24" y="24" width="72" height="30" rx="15" fill="url(#blue)"/>
    <text x="38" y="45" class="stage-label" fill="#ffffff">01</text>
    <text x="24" y="86" class="stage-title">Plan and build</text>

    <g filter="url(#shadow)">
      <rect x="24" y="118" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="151" r="18" fill="url(#blue)"/>
      <text x="85" y="149" class="card-title">Planner</text>
      <text x="85" y="174" class="card-text">Task to structured plan</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="24" y="234" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="267" r="18" fill="url(#green)"/>
      <text x="85" y="265" class="card-title">Coder</text>
      <text x="85" y="290" class="card-text">Generate or edit Vite app</text>
    </g>
  </g>

  <g transform="translate(378 198)">
    <rect width="252" height="358" rx="22" class="panel"/>
    <rect x="24" y="24" width="72" height="30" rx="15" fill="url(#green)"/>
    <text x="38" y="45" class="stage-label" fill="#ffffff">02</text>
    <text x="24" y="86" class="stage-title">Execute in browser</text>

    <g filter="url(#shadow)">
      <rect x="24" y="118" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="151" r="18" fill="url(#green)"/>
      <text x="85" y="149" class="card-title">Workspace</text>
      <text x="85" y="174" class="card-text">React source, CSS, package</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="24" y="234" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="267" r="18" fill="url(#orange)"/>
      <text x="85" y="265" class="card-title">Executor</text>
      <text x="85" y="290" class="card-text">Vite server plus Chromium</text>
    </g>
  </g>

  <g transform="translate(676 198)">
    <rect width="252" height="358" rx="22" class="panel"/>
    <rect x="24" y="24" width="72" height="30" rx="15" fill="url(#violet)"/>
    <text x="38" y="45" class="stage-label" fill="#ffffff">03</text>
    <text x="24" y="86" class="stage-title">Inspect evidence</text>

    <g filter="url(#shadow)">
      <rect x="24" y="118" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="151" r="18" fill="url(#violet)"/>
      <text x="85" y="149" class="card-title">Evidence</text>
      <text x="85" y="174" class="card-text">Screenshots, DOM, logs</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="24" y="234" width="204" height="92" rx="18" class="card"/>
      <circle cx="57" cy="267" r="18" fill="url(#blue)"/>
      <text x="85" y="265" class="card-title">Tester</text>
      <text x="85" y="290" class="card-text">Load, forms, clicks, mobile</text>
    </g>
  </g>

  <g transform="translate(974 198)">
    <rect width="226" height="358" rx="22" class="panel"/>
    <rect x="24" y="24" width="72" height="30" rx="15" fill="url(#orange)"/>
    <text x="38" y="45" class="stage-label" fill="#ffffff">04</text>
    <text x="24" y="86" class="stage-title">Reflect and report</text>

    <g filter="url(#shadow)">
      <rect x="24" y="118" width="178" height="92" rx="18" class="card"/>
      <circle cx="57" cy="151" r="18" fill="url(#orange)"/>
      <text x="85" y="149" class="card-title">Reflector</text>
      <text x="85" y="174" class="card-text">Classify failures</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="24" y="234" width="178" height="92" rx="18" class="card"/>
      <circle cx="57" cy="267" r="18" fill="url(#green)"/>
      <text x="85" y="265" class="card-title">Artifacts</text>
      <text x="85" y="290" class="card-text">summary.json and reports</text>
    </g>
  </g>

  <path class="arrow" d="M308 351 H395"/>
  <path class="arrow" d="M606 351 H693"/>
  <path class="arrow" d="M904 351 H991"/>
  <path class="arrow-soft" d="M1090 432 C1090 622 476 642 476 532"/>
  <path class="arrow-soft" d="M1075 430 C1010 600 794 604 794 532"/>

  <g transform="translate(80 574)">
    <rect width="1120" height="78" rx="18" class="pill"/>
    <text x="28" y="32" class="small">Core loop:</text>
    <text x="116" y="32" class="subtitle">implement -> execute -> inspect -> repair</text>
    <text x="28" y="58" class="small">Run outputs:</text>
    <text x="136" y="58" class="subtitle">screenshots, DOM snapshots, console logs, test results, repair plans, and evaluation tables</text>
  </g>
</svg>
